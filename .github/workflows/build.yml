name: Build Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang perl git curl dpkg sudo
      
      - name: Install Theos (Official Script)
        run: |
          sudo mkdir -p /opt/theos
          sudo chown -R $USER:$USER /opt/theos
          export THEOS=/opt/theos
          # Официальный установщик сам скачает и тулчейн, и SDK куда нужно
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          if [ -d "$HOME/theos" ]; then
            cp -rn $HOME/theos/* /opt/theos/ 2>/dev/null || true
          fi
          
      - name: Build Package
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passcode-customizer-deb
          path: packages/*.deb
          
