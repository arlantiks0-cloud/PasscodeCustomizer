name: Build Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang perl git curl dpkg
      
      - name: Setup Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER:$USER /opt/theos
          
      - name: Download iOS SDKs
        run: |
          rm -rf /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git /opt/theos/sdks
          
      - name: Build Package
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passcode-customizer-deb
          path: packages/*.deb
          
