name: Build Tweak

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y bash curl git make clang build-essential sudo perl
          export THEOS=/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Download iOS SDKs
        run: |
          export THEOS=/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/* $THEOS/sdks/
          
      - name: Build Package
        run: |
          export THEOS=/theos
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passcode-customizer-deb
          path: packages/*.deb
          
